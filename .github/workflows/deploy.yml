name: Deploy CloudChat AI to EC2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE_BACKEND: cloudchat-backend
  DOCKER_IMAGE_FRONTEND: cloudchat-frontend

jobs:
  # Job 1: Test the code
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Test Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build --if-present
        # Add tests when you have them
        # npm test

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Test Backend
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        # Run API health check
        python -c "from main import app; print('Backend imports OK')"

  # Job 2: Build and push Docker images (optional - for Docker registry)
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Backend Image
      run: |
        cd backend
        docker build -t ${{ env.DOCKER_IMAGE_BACKEND }} .
        
    - name: Build Frontend Image
      run: |
        cd frontend
        docker build -t ${{ env.DOCKER_IMAGE_FRONTEND }} .

    - name: Save Backend Image
      run: docker save ${{ env.DOCKER_IMAGE_BACKEND }} -o backend.tar

    - name: Save Frontend Image
      run: docker save ${{ env.DOCKER_IMAGE_FRONTEND }} -o frontend.tar

    - name: Upload Backend Image Artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-image
        path: backend.tar
        retention-days: 1

    - name: Upload Frontend Image Artifact
      uses: actions/upload-artifact@v3
      with:
        name: frontend-image
        path: frontend.tar
        retention-days: 1

  # Job 3: Deploy to EC2
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download Backend Image
      uses: actions/download-artifact@v3
      with:
        name: backend-image

    - name: Download Frontend Image
      uses: actions/download-artifact@v3
      with:
        name: frontend-image

    - name: Load Docker Images
      run: |
        docker load -i backend.tar
        docker load -i frontend.tar

    - name: Deploy to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "backend.tar,frontend.tar,docker-compose.yml,.env"
        target: "/home/ubuntu/cloudchat-deploy"

    - name: Execute deployment on EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/cloudchat-deploy
          docker load -i backend.tar
          docker load -i frontend.tar
          docker-compose down
          docker-compose up -d
          docker system prune -f
          echo "Deployment completed successfully!"
