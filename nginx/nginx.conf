events {}

http {
    # Reverse proxy: serves the frontend and routes /api to the backend.
    server {
        listen 80;
        server_name _;

        # API calls -> backend container. The trailing slash on proxy_pass
        # strips the /api/ prefix, so /api/chat reaches the backend as /chat.
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> frontend container (static React app).
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
